		<!-- VCX NAV widget (React, compiled in-browser) -->
			<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
			<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
			<script crossorigin src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
			<script type="text/babel" data-presets="react">
				const { useState, useMemo } = React;

				const SHARES = 28.35;
				const BASE = 679;
				const VCX_PRICE = 36.27;
				const SPCX_PRICE = 114.50;
				const SPCX_SHARES_B = 13.16; // billion shares outstanding
				const SPCX_MKTCAP = SPCX_PRICE * SPCX_SHARES_B; // ~$1,506B = $1.506T

				const PORTFOLIO = [
				  {n:"Anthropic",s:"AI models",w:.207,ed:"Dec 2023 (secondary)",ev:15,st:183,c:965,b:3000,
				    cn:"Series H · $965B · May 28, 2026",bn:"Gerstner/Baker $3T IPO target · Oct–Nov 2026",sts:"📋 S-1 Filed",hl:"ipo"},
				  {n:"Databricks",s:"Data & AI infra",w:.177,ed:"Jul/Nov 2023",ev:15,st:43,c:134,b:180,
				    cn:"Series L · Feb 9, 2026",bn:"IPO target est.",sts:"Pre-IPO",hl:""},
				  {n:"OpenAI",s:"AI models",w:.099,ed:"Dec 2023/Sep 2024",ev:80,st:157,c:852,b:1000,
				    cn:"Apr 2026 · $852B · S-1 filed Jun 8",bn:"IPO target ~$1T · late 2026/2027",sts:"📋 S-1 Filed",hl:"ipo"},
				  {n:"Anduril",s:"Defense tech",w:.069,ed:"Oct 2023",ev:1.9,st:30.5,c:61,b:100,
				    cn:"Series H closed · $61B · May 2026",bn:"🔄 Talks · $100B · Jul 24, 2026",sts:"🔄 Raising",hl:"new"},
				  {n:"Ramp",s:"Fintech",w:.051,ed:"Jan 2025",ev:13,st:22.5,c:44,b:44,
				    cn:"Series F · $44B · Jun 4, 2026",bn:"Series F · $44B · Jun 4, 2026",sts:"🆕 New round",hl:"new"},
				  {n:"SpaceX",s:"Aerospace / xAI / Grok",w:.050,ed:"Jul 2025 (secondary)",ev:350,st:350,
				    c:Math.round(SPCX_MKTCAP), b:Math.round(SPCX_MKTCAP),
				    cn:`🚀 SPCX $${SPCX_PRICE} · $${(SPCX_MKTCAP/1000).toFixed(2)}T · Jul 30`,
				    bn:`🚀 SPCX $${SPCX_PRICE} · $${(SPCX_MKTCAP/1000).toFixed(2)}T · Jul 30`,sts:"🚀 Public (SPCX)",hl:"spacex"},
				  {n:"Epic Games",s:"Gaming",w:.035,ed:"2022–23",ev:31.5,st:22.5,c:22.5,b:30,
				    cn:"Disney round · Feb 2024",bn:"Secondary est.",sts:"Private",hl:""},
				  {n:"Flock Safety",s:"Public safety tech",w:.030,ed:"Oct 2023",ev:3.5,st:5,c:8.4,b:10,
				    cn:"Apr 2026 · $8.4B",bn:"Near-term est.",sts:"Pre-IPO",hl:""},
				  {n:"dbt / Fivetran",s:"Data infra",w:.028,ed:"Jul 2023",ev:4.2,st:4.2,c:5.5,b:8,
				    cn:"Merger est. · Oct 2025",bn:"Combined IPO est.",sts:"Pre-IPO",hl:""},
				  {n:"Vanta",s:"Security / GRC",w:.019,ed:"Sep 2022",ev:1.6,st:4.15,c:4.15,b:6,
				    cn:"Series D · Jul 2025",bn:"IPO-ready est.",sts:"Pre-IPO",hl:""},
				  {n:"Canva",s:"Design SaaS",w:.018,ed:"Sep 2023",ev:39,st:42,c:42,b:55,
				    cn:"Aug 2025 tender · $42B",bn:"H2 2026 IPO target",sts:"Pre-IPO",hl:""},
				  {n:"Loyal",s:"Veterinary biotech",w:.015,ed:"2022–23",ev:.2,st:.5,c:.8,b:1.2,
				    cn:"Clinical stage est.",bn:"Pre-revenue est.",sts:"Private",hl:""},
				  {n:"ServiceTitan",s:"Field service SaaS",w:.014,ed:"2022–23",ev:7.4,st:5.2,c:5.2,b:7,
				    cn:"TTAN public · ~$5.2B",bn:"Recovery scenario",sts:"📈 Public (TTAN)",hl:""},
				  {n:"Inspectify",s:"PropTech",w:.011,ed:"2022–23",ev:.1,st:.15,c:.2,b:.4,
				    cn:"Series A est.",bn:"Growth est.",sts:"Private",hl:""},
				  {n:"Visual Layer",s:"AI / data labeling",w:.009,ed:"2023",ev:.08,st:.12,c:.2,b:.4,
				    cn:"~est.",bn:"~est.",sts:"Private",hl:""},
				  {n:"Handshake",s:"HR / recruiting",w:.009,ed:"2022–23",ev:3.5,st:3.5,c:3.5,b:5,
				    cn:"Series F est. stable",bn:"IPO candidate",sts:"Pre-IPO",hl:""},
				  {n:"AI-LLM LLC",s:"AI (undisclosed)",w:.009,ed:"2023–24",ev:.5,st:1,c:2,b:5,
				    cn:"~est.",bn:"~est.",sts:"Private",hl:""},
				  {n:"Fin (Intercom)",s:"Customer AI",w:.008,ed:"2022–23",ev:1.3,st:1.5,c:3.6,b:3.6,
				    cn:"🤝 Salesforce acquisition · $3.6B · Jun 15",bn:"🤝 Salesforce acquisition · $3.6B",sts:"🤝 Acquired",hl:"acquired"},
				  {n:"Anyscale",s:"AI infra (Ray)",w:.008,ed:"2023",ev:1,st:1,c:1.65,b:1.65,
				    cn:"🤝 Acquired by Nscale · $1.65B · Jul 30",bn:"🤝 Acquired by Nscale · $1.65B · Jul 30",sts:"🤝 Acquired",hl:"acquired"},
				  {n:"Rhino",s:"PropTech / fintech",w:.007,ed:"2022",ev:.3,st:.3,c:.4,b:.6,
				    cn:"~est.",bn:"~est.",sts:"Private",hl:""},
				  {n:"Immuta",s:"Data security",w:.007,ed:"2022–23",ev:1,st:1.2,c:1.5,b:2.5,
				    cn:"~Series E est.",bn:"~est.",sts:"Private",hl:""},
				  {n:"Ditto",s:"Edge sync / IoT",w:.007,ed:"2022–23",ev:.2,st:.3,c:.4,b:.7,
				    cn:"~est.",bn:"~est.",sts:"Private",hl:""},
				  {n:"Hightouch",s:"Data activation",w:.006,ed:"2023",ev:.6,st:1,c:1.5,b:2.5,
				    cn:"~Series B est.",bn:"~est.",sts:"Private",hl:""},
				  {n:"Omni",s:"BI / analytics",w:.006,ed:"2023",ev:.15,st:.25,c:.4,b:.8,
				    cn:"~Series A/B est.",bn:"~est.",sts:"Private",hl:""},
				  {n:"Risotto",s:"HR / IT automation",w:.005,ed:"2023",ev:.05,st:.08,c:.15,b:.3,
				    cn:"~Seed/A est.",bn:"~est.",sts:"Private",hl:""},
				  {n:"Luminos",s:"AI (undisclosed)",w:.005,ed:"2023",ev:.08,st:.1,c:.2,b:.5,
				    cn:"~est.",bn:"~est.",sts:"Private",hl:""},
				  {n:"Stripe",s:"Fintech / payments",w:.005,ed:"2022–23",ev:50,st:91.5,c:159,b:200,
				    cn:"Feb 2026 secondary · $159B",bn:"Near IPO est.",sts:"Pre-IPO",hl:""},
				  {n:"Gumloop",s:"AI automation",w:.004,ed:"2024",ev:.05,st:.1,c:.3,b:.8,
				    cn:"~Seed/A est.",bn:"~est.",sts:"Private",hl:""},
				];

				const HL = {
				  ipo:     {row:"#eff6ff",val:"#1d4ed8",badge:{background:"#dbeafe",color:"#1e40af"}},
				  new:     {row:"#f0fdf4",val:"#15803d",badge:{background:"#dcfce7",color:"#166534"}},
				  spacex:  {row:"#fdf4ff",val:"#7c3aed",badge:{background:"#f3e8ff",color:"#6d28d9"}},
				  acquired:{row:"#fff7ed",val:"#c2410c",badge:{background:"#ffedd5",color:"#9a3412"}},
				  "":      {row:null,     val:"#374151",badge:{background:"#f3f4f6",color:"#6b7280"}},
				};

				function fmt(n){
				  if(!n&&n!==0)return"—";
				  if(n>=1000)return"$"+(n/1000).toFixed(2)+"T";
				  if(n>=1)return"$"+n.toFixed(1)+"B";
				  return"$"+(n*1000).toFixed(0)+"M";
				}
				function fmtM(n){return"$"+Math.round(n)+"M";}

				function VCXNav(){
				  const[bull,setBull]=useState(false);
				  const[query,setQuery]=useState("");
				  const[sortK,setSortK]=useState("w");
				  const[sortD,setSortD]=useState(-1);

				  const computed=useMemo(()=>PORTFOLIO.map(h=>{
				    const pb=h.w*BASE;
				    const curr=bull?h.b:h.c;
				    const pu=h.st?pb*(curr/h.st):pb;
				    const ng=(pu-pb)/SHARES;
				    return{...h,pb,curr,pu,ng};
				  }),[bull]);

				  const totB=computed.reduce((s,h)=>s+h.pb,0);
				  const totU=computed.reduce((s,h)=>s+h.pu,0);
				  const newNav=18.97+(totU-totB)/SHARES;
				  const pctGain=Math.round(((newNav/18.97)-1)*100);
				  const premium=((VCX_PRICE/newNav)-1)*100;
				  const isDiscount=premium<0;

				  const filtered=useMemo(()=>{
				    const q=query.toLowerCase();
				    let rows=q?computed.filter(h=>h.n.toLowerCase().includes(q)||h.s.toLowerCase().includes(q)):[...computed];
				    rows.sort((a,b)=>{
				      const va=a[sortK],vb=b[sortK];
				      if(typeof va==="string")return sortD*va.localeCompare(vb);
				      return sortD*((vb||0)-(va||0));
				    });
				    return rows;
				  },[computed,query,sortK,sortD]);

				  function sort(k){if(sortK===k)setSortD(d=>d*-1);else{setSortK(k);setSortD(-1);}}

				  const TH=({k,label})=>(
				    <th onClick={()=>sort(k)} style={{cursor:"pointer",textAlign:"left",fontSize:"10px",fontWeight:500,color:"#6b7280",padding:"6px 7px",borderBottom:"1px solid #e5e7eb",background:"white",whiteSpace:"nowrap",userSelect:"none"}}>
				      {label} {sortK===k?(sortD>0?"▲":"▼"):<span style={{opacity:.3}}>▲</span>}
				    </th>
				  );

				  const updates=[
				    {emoji:"🧠",color:"#1e40af",bg:"#eff6ff",border:"#93c5fd",
				      text:<><strong>Anthropic:</strong> Series H closed $965B (May 28). Gerstner/Baker predict <strong>$3T IPO</strong> Oct–Nov 2026. Conservative = $965B.</>},
				    {emoji:"🔄",color:"#166534",bg:"#f0fdf4",border:"#86efac",
				      text:<><strong>Anduril:</strong> In talks for $100B round (Reuters Jul 24) — not closed. Conservative holds $61B.</>},
				    {emoji:"🚀",color:"#6d28d9",bg:"#fdf4ff",border:"#c4b5fd",
				      text:<><strong>SpaceX SPCX:</strong> $114.50 · $1.506T mkt cap · Jul 30. Near 52-week low ($107.01 Jul 28). Q2 earnings Aug 4, 20% share unlock Aug 6.</>},
				    {emoji:"🤝",color:"#9a3412",bg:"#fff7ed",border:"#fed7aa",
				      text:<><strong>Anyscale → Nscale:</strong> Acquired today for <strong>$1.65B</strong>. Stale mark corrected to $1B (Series C 2021). Small uplift on exit.</>},
				    {emoji:"🤝",color:"#9a3412",bg:"#fff7ed",border:"#fed7aa",
				      text:<><strong>Fin/Intercom → Salesforce:</strong> $3.6B acquisition (Jun 15). Closes Q4 FY2027.</>},
				  ];

				  return(
				    <div style={{padding:"16px",fontFamily:"system-ui,sans-serif",maxWidth:"100%"}}>
				      <div style={{marginBottom:"10px"}}>
				        <h2 style={{fontSize:"16px",fontWeight:500,margin:"0 0 2px",color:"#111"}}>VCX — Full portfolio NAV model</h2>
				        <p style={{fontSize:"11px",color:"#6b7280",margin:0}}>28 companies · Updated Jul 30, 2026 · VCX $36.27 · SPCX $114.50 · Anyscale acquired · Stale marks corrected</p>
				      </div>

				      <div style={{background:isDiscount?"#f0fdf4":"#fef9c3",borderLeft:`3px solid ${isDiscount?"#16a34a":"#ca8a04"}`,padding:"8px 12px",borderRadius:"0 6px 6px 0",marginBottom:"8px",fontSize:"11px",color:isDiscount?"#14532d":"#713f12",lineHeight:1.6}}>
				        <strong>VCX $36.27 · {isDiscount?`${Math.abs(premium).toFixed(0)}% DISCOUNT to updated NAV`:`${premium.toFixed(0)}% premium to updated NAV`}</strong> · ATH $575 (Mar 25) → now −94% · Official stale NAV $18.43 (Mar 31) · <strong>Lockup expires Aug 13</strong> (accelerated from Sep 19) · Q2 NAV update est. mid-Aug · SPCX also has 20% unlock Aug 6
				      </div>

				      <div style={{display:"flex",flexDirection:"column",gap:"5px",marginBottom:"12px"}}>
				        {updates.map((u,i)=>(
				          <div key={i} style={{background:u.bg,borderLeft:`3px solid ${u.border}`,padding:"6px 10px",borderRadius:"0 5px 5px 0",fontSize:"11px",color:u.color,lineHeight:1.5}}>
				            <span style={{marginRight:"4px"}}>{u.emoji}</span>{u.text}
				          </div>
				        ))}
				      </div>

				      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(115px,1fr))",gap:"8px",marginBottom:"12px"}}>
				        {[
				          {l:"Official NAV/sh",v:"$18.43",s:"Mar 31, 2026 · stale",g:false},
				          {l:"Updated NAV/sh",v:"$"+newNav.toFixed(2),s:"+"+pctGain+"% vs. official",g:true},
				          {l:"VCX $36.27",v:isDiscount?Math.abs(premium).toFixed(0)+"% discount":premium.toFixed(0)+"% premium",s:isDiscount?"trading BELOW updated NAV":"to updated NAV",g:isDiscount},
				          {l:"Updated portfolio",v:fmtM(totU),s:"vs. $679M official",g:true},
				        ].map(m=>(
				          <div key={m.l} style={{background:m.g?"#f0fdf4":"#f9fafb",borderRadius:"8px",padding:"10px 12px",border:`1px solid ${m.g?"#bbf7d0":"#e5e7eb"}`}}>
				            <div style={{fontSize:"9.5px",color:"#6b7280",textTransform:"uppercase",letterSpacing:".05em",marginBottom:"2px"}}>{m.l}</div>
				            <div style={{fontSize:"18px",fontWeight:500,color:m.g?"#166534":"#4b5563"}}>{m.v}</div>
				            <div style={{fontSize:"9.5px",color:"#9ca3af",marginTop:"1px"}}>{m.s}</div>
				          </div>
				        ))}
				      </div>

				      <div style={{display:"flex",gap:"8px",marginBottom:"10px",flexWrap:"wrap",alignItems:"center"}}>
				        <button onClick={()=>setBull(false)} style={{padding:"5px 12px",fontSize:"11px",borderRadius:"6px",border:`1px solid ${!bull?"#93c5fd":"#d1d5db"}`,background:!bull?"#dbeafe":"transparent",color:!bull?"#1d4ed8":"#6b7280",fontWeight:!bull?500:400,cursor:"pointer"}}>Conservative</button>
				        <button onClick={()=>setBull(true)} style={{padding:"5px 12px",fontSize:"11px",borderRadius:"6px",border:`1px solid ${bull?"#93c5fd":"#d1d5db"}`,background:bull?"#dbeafe":"transparent",color:bull?"#1d4ed8":"#6b7280",fontWeight:bull?500:400,cursor:"pointer"}}>Bull case</button>
				        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search…" style={{padding:"5px 9px",fontSize:"11px",border:"1px solid #d1d5db",borderRadius:"6px",outline:"none",width:"130px"}}/>
				        <span style={{fontSize:"10px",color:"#9ca3af",marginLeft:"auto"}}>🔄 raising · 📋 S-1 · 🚀/📈 public · 🤝 acquired · 🆕 new round</span>
				      </div>

				      <div style={{overflowX:"auto",maxHeight:"440px",overflowY:"auto",border:"1px solid #e5e7eb",borderRadius:"8px"}}>
				        <table style={{width:"100%",borderCollapse:"collapse",fontSize:"11px",tableLayout:"fixed",minWidth:"840px"}}>
				          <colgroup>
				            <col style={{width:"14%"}}/><col style={{width:"6%"}}/><col style={{width:"9%"}}/><col style={{width:"11%"}}/><col style={{width:"11%"}}/><col style={{width:"15%"}}/><col style={{width:"11%"}}/><col style={{width:"8%"}}/><col style={{width:"15%"}}/>
				          </colgroup>
				          <thead style={{position:"sticky",top:0,zIndex:10}}>
				            <tr>
				              <TH k="n" label="Company"/>
				              <TH k="w" label="Wt."/>
				              <TH k="pb" label="Position (NAV)"/>
				              <TH k="ev" label="Entry val. (VCX)"/>
				              <TH k="st" label="Stale mark ($18.43)"/>
				              <TH k="curr" label="Current val."/>
				              <TH k="pu" label="Updated position"/>
				              <TH k="ng" label="NAV/sh uplift"/>
				              <TH k="sts" label="Status"/>
				            </tr>
				          </thead>
				          <tbody>
				            {filtered.map((h,i)=>{
				              const hl=HL[h.hl]||HL[""];
				              const rowBg=hl.row||(i%2===0?"white":"#f9fafb");
				              return(
				                <tr key={h.n} style={{background:rowBg}}>
				                  <td style={{padding:"7px 7px",borderBottom:"1px solid #f3f4f6"}}>
				                    <div style={{fontWeight:500,fontSize:"11.5px"}}>{h.n}</div>
				                    <div style={{color:"#9ca3af",fontSize:"9.5px",marginTop:"1px"}}>{h.s}</div>
				                  </td>
				                  <td style={{padding:"7px 7px",borderBottom:"1px solid #f3f4f6"}}>{(h.w*100).toFixed(1)}%</td>
				                  <td style={{padding:"7px 7px",borderBottom:"1px solid #f3f4f6"}}>{fmtM(h.pb)}</td>
				                  <td style={{padding:"7px 7px",borderBottom:"1px solid #f3f4f6"}}>
				                    {fmt(h.ev)}<div style={{color:"#9ca3af",fontSize:"9px",marginTop:"1px"}}>{h.ed}</div>
				                  </td>
				                  <td style={{padding:"7px 7px",borderBottom:"1px solid #f3f4f6"}}>{fmt(h.st)}</td>
				                  <td style={{padding:"7px 7px",borderBottom:"1px solid #f3f4f6"}}>
				                    <span style={{color:h.hl?hl.val:"#374151",fontWeight:h.hl?"500":"400"}}>{fmt(h.curr)}</span>
				                    <div style={{color:h.hl?hl.val:"#9ca3af",fontSize:"9px",marginTop:"1px"}}>{bull?h.bn:h.cn}</div>
				                  </td>
				                  <td style={{padding:"7px 7px",borderBottom:"1px solid #f3f4f6",fontWeight:500}}>{fmtM(h.pu)}</td>
				                  <td style={{padding:"7px 7px",borderBottom:"1px solid #f3f4f6",fontWeight:500,color:h.ng>0.02?"#15803d":h.ng<-0.02?"#b91c1c":"#6b7280"}}>
				                    {h.ng>=0?"+":""}${Math.abs(h.ng).toFixed(2)}
				                  </td>
				                  <td style={{padding:"7px 7px",borderBottom:"1px solid #f3f4f6"}}>
				                    <span style={{...hl.badge,fontSize:"9.5px",fontWeight:500,padding:"2px 6px",borderRadius:"4px",display:"inline-block"}}>{h.sts}</span>
				                  </td>
				                </tr>
				              );
				            })}
				            <tr style={{background:"#f0fdf4",position:"sticky",bottom:0}}>
				              <td colSpan="6" style={{padding:"8px 7px",fontWeight:600,color:"#166534",borderTop:"1px solid #bbf7d0"}}>Total portfolio (all 28)</td>
				              <td style={{padding:"8px 7px",fontWeight:600,color:"#166534",borderTop:"1px solid #bbf7d0"}}>{fmtM(totU)}</td>
