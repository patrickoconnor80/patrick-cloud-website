<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found</title>
<link rel="shortcut icon" href="images/favicon.ico" />
<style>
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f8fafc;
    color:#334155;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    text-align:center;
  }
  .wrap{padding:40px 28px;max-width:440px;}
  .code{
    font-family:'SFMono-Regular',Consolas,Menlo,monospace;
    font-size:13px;letter-spacing:.2em;text-transform:uppercase;
    color:#1d4ed8;font-weight:600;margin:0 0 18px;
  }
  h1{font-size:26px;margin:0 0 14px;color:#0f172a;}
  p{font-size:16px;line-height:1.6;color:#64748b;margin:0 0 28px;}
  a.home{
    display:inline-block;font-family:'SFMono-Regular',Consolas,Menlo,monospace;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
    padding:10px 22px;border:1.5px solid #0f172a;border-radius:4px;
    color:#0f172a;text-decoration:none;
  }
  a.home:hover{background:#0f172a;color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist, or the link is out of date.</p>
  <a class="home" href="/">Back to Patrick O'Connor</a>
</div>
</body>
</html>
